<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The 1% Club</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <style>
    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at 50% 0%, #0d2a6b, #050b1a 55%);
      color: var(--text-light);
      font-family: var(--font-body);
    }
    .wrap { width: min(560px, 100%); }
    h1 {
      font-family: var(--font-display);
      letter-spacing: 0.06em;
      margin: 0 0 0.35rem;
      font-size: clamp(2rem, 8vw, 3rem);
    }
    h1 span { color: var(--club-cyan); }
    p { color: var(--text-muted); margin: 0 0 1rem; }
    .links { display: grid; gap: 0.75rem; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(13, 34, 88, 0.65);
      border: 1px solid rgba(46, 230, 255, 0.25);
      border-radius: 14px;
      padding: 1rem 1.1rem;
    }
    a.card strong {
      display: block;
      color: var(--club-cyan);
      letter-spacing: 0.06em;
      margin-bottom: 0.25rem;
    }
    a.card span { color: var(--text-muted); font-size: 0.9rem; word-break: break-all; }
    .meta { margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-muted); }
    code { color: var(--club-cyan); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>THE <span>1%</span> CLUB</h1>
    <p>Use the <strong>LAN IP</strong> links below on phones and the TV.</p>
    <div class="links" id="links">
      <a class="card" href="/display/"><strong>TV DISPLAY</strong><span>Loading best URL…</span></a>
      <a class="card" href="/host/"><strong>HOST</strong><span>Loading…</span></a>
      <a class="card" href="/play/"><strong>PLAY</strong><span>Loading…</span></a>
      <a class="card" href="/qa/"><strong>QA BOARD</strong><span>Feedback</span></a>
    </div>
    <p class="meta" id="meta">Checking server…</p>
  </div>
  <script type="module">
    try {
      const info = await fetch('/api/info').then((r) => r.json());
      const primary = info.primary || location.origin;
      document.getElementById('links').innerHTML = `
        <a class="card" href="${primary}/display/"><strong>TV DISPLAY</strong><span>${primary}/display/</span></a>
        <a class="card" href="${primary}/host/"><strong>HOST</strong><span>${primary}/host/</span></a>
        <a class="card" href="${primary}/play/"><strong>PLAY</strong><span>${primary}/play/</span></a>
        <a class="card" href="${primary}/qa/"><strong>QA BOARD</strong><span>${primary}/qa/</span></a>
      `;
      document.getElementById('meta').innerHTML =
        `Server OK · LAN <code>${primary}</code>` +
        (info.lanIps?.length ? ` · IPs: ${info.lanIps.join(', ')}` : '');
    } catch (err) {
      document.getElementById('meta').textContent = 'Could not reach /api/info — is the server running?';
    }
  </script>
</body>
</html>
